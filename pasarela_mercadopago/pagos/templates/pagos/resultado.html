<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Pago - MOTO-TOP</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .exito { color: #2ecc71; }
        .error { color: #e74c3c; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="card">
        {% if estado == 'exito' %}
            <h1 class="exito">¡Pago Procesado!</h1>
            <p>El pago de la factura <strong>#{{ factura_id }}</strong> fue asentado con éxito en el sistema.</p>
            <p>ID de Transacción MP: {{ pago_id }}</p>
        {% else %}
            <h1 class="error">Control de Pago</h1>
            <p>{{ mensaje }}</p>
        {% endif %}
        
        <a href="/" class="btn">Volver al Inicio</a>
    </div>

</body>
</html>
